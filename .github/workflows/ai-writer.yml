name: Jaziel AI Writer

on:
  workflow_dispatch:
    inputs:
      draft_file:
        description: "Path to draft JSON in the repository"
        required: true
        default: "content/drafts/current.json"
      publish:
        description: "Publish generated article to Jaziel"
        required: true
        type: boolean
        default: false

  repository_dispatch:
    types: [jaziel_ai_build]

permissions:
  contents: write

jobs:
  ai-writer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Pilot
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve draft path and publish mode
        id: inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_DRAFT: ${{ github.event.client_payload.draft_file }}
          MANUAL_DRAFT: ${{ inputs.draft_file }}
          DISPATCH_PUBLISH: ${{ github.event.client_payload.publish }}
          MANUAL_PUBLISH: ${{ inputs.publish }}
        run: |
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            echo "draft_file=${DISPATCH_DRAFT:-content/drafts/current.json}" >> "$GITHUB_OUTPUT"
            echo "publish=${DISPATCH_PUBLISH:-false}" >> "$GITHUB_OUTPUT"
          else
            echo "draft_file=${MANUAL_DRAFT:-content/drafts/current.json}" >> "$GITHUB_OUTPUT"
            echo "publish=${MANUAL_PUBLISH:-false}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Gemini AI Writer
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
          GEMINI_FALLBACK_MODEL: gemini-3.7-flash
          DRAFT_FILE: ${{ steps.inputs.outputs.draft_file }}
        run: |
          set -euo pipefail

          test -n "${GEMINI_API_KEY:-}" || {
            echo "GEMINI_API_KEY secret is missing."
            exit 1
          }

          test -f "$DRAFT_FILE" || {
            echo "Draft not found: $DRAFT_FILE"
            exit 1
          }

          mkdir -p content/articles generated/articles

          python scripts/ai_writer.py \
            --input "$DRAFT_FILE" \
            --output content/articles/ai-test.json

      - name: Validate Schema v1
        run: python scripts/validate.py

      - name: Generate HTML
        run: python scripts/generate.py

      - name: Resolve generated article slug
        id: article
        shell: bash
        run: |
          set -euo pipefail

          test -f content/articles/ai-test.json || {
            echo "Generated article JSON not found."
            exit 1
          }

          SLUG="$(python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("content/articles/ai-test.json").read_text(encoding="utf-8")
          )

          slug = str(data.get("slug", "")).strip()

          if not slug:
              raise SystemExit("Article slug is missing from ai-test.json")

          print(slug)
          PY
          )"

          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "Generated article slug: $SLUG"

      - name: Verify generated HTML
        shell: bash
        env:
          SLUG: ${{ steps.article.outputs.slug }}
        run: |
          set -euo pipefail

          HTML_PATH="generated/articles/${SLUG}/index.html"

          echo "Checking generated HTML:"
          echo "$HTML_PATH"

          test -f "$HTML_PATH" || {
            echo "Generated HTML not found: $HTML_PATH"
            echo "Available generated article directories:"
            find generated/articles -maxdepth 2 -type f -name "index.html" -print || true
            exit 1
          }

          if grep -nE '\{\{[^}]+\}\}' "$HTML_PATH"; then
            echo "Unresolved template placeholders found."
            exit 1
          fi

          echo "Generated HTML verification passed."

      - name: Verify selected article images
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          root = Path(".")
          article_path = Path("content/articles/ai-test.json")
          data = json.loads(article_path.read_text(encoding="utf-8"))

          sources = []
          cover = data.get("cover") or {}
          if cover.get("src"):
              sources.append(cover["src"])

          for image in data.get("images") or []:
              if isinstance(image, dict) and image.get("src"):
                  sources.append(image["src"])

          if not sources:
              print("No article images selected.")
              raise SystemExit(0)

          for source in sources:
              repo_path = source.split("?", 1)[0].split("#", 1)[0].lstrip("/")
              path = root / repo_path
              if not path.is_file():
                  raise SystemExit(f"Selected article image not found: {repo_path}")
              print(f"Image OK: {repo_path} ({path.stat().st_size} bytes)")

          print(f"Verified {len(sources)} selected article image(s).")
          PY

      - name: Upload Gemini result
        uses: actions/upload-artifact@v4
        with:
          name: jaziel-ai-result
          path: |
            content/articles/ai-test.json
            generated/articles/${{ steps.article.outputs.slug }}/index.html
          if-no-files-found: error

      - name: Publish to Jaziel
        if: ${{ steps.inputs.outputs.publish == 'true' }}
        env:
          JAZIEL_PUBLISH_TOKEN: ${{ secrets.JAZIEL_PUBLISH_TOKEN }}
        run: python scripts/publish.py --apply
