name: Jaziel Publish

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Actually publish generated articles to the Jaziel repository'
        required: true
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - 'content/articles/**'
      - 'content/drafts/**'
      - 'schemas/**'
      - 'templates/article.html'
      - 'scripts/ai_writer.py'
      - 'scripts/generate.py'
      - 'scripts/validate.py'
      - 'scripts/publish.py'
      - 'requirements.txt'
      - 'config.json'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AI Pilot
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Gemini AI Writer test draft
        if: ${{ github.event_name == 'push' && hashFiles('content/drafts/*.json') != '' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GEMINI_API_KEY:-}" || { echo 'GEMINI_API_KEY secret is missing.'; exit 1; }
          mkdir -p content/articles generated/ai-test
          draft="$(find content/drafts -maxdepth 1 -type f -name '*.json' | sort | head -n 1)"
          python scripts/ai_writer.py --input "$draft" --output content/articles/ai-test.json
          cp content/articles/ai-test.json generated/ai-test/ai-test.json

      - name: Validate articles
        run: python scripts/validate.py

      - name: Generate articles
        run: python scripts/generate.py

      - name: Verify generated HTML
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find generated/articles -type f -name 'index.html' -print -quit)"
          if grep -RIn --include='*.html' -E '\{\{[^}]+\}\}' generated/articles; then
            echo 'Unresolved template placeholders found.'
            exit 1
          fi

      - name: Upload AI test output
        if: ${{ github.event_name == 'push' && hashFiles('content/drafts/*.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: jaziel-ai-test-output
          path: |
            content/articles/ai-test.json
            generated/articles/ai-test/index.html
          if-no-files-found: error

      - name: Publish to Jaziel
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true }}
        env:
          JAZIEL_PUBLISH_TOKEN: ${{ secrets.JAZIEL_PUBLISH_TOKEN }}
        run: python scripts/publish.py --apply
