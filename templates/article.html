<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{SEO_TITLE}}</title>
  <meta name="description" content="{{SEO_DESCRIPTION}}">
  <meta name="robots" content="index,follow">
  {{CANONICAL}}
  <meta property="og:type" content="article">
  <meta property="og:title" content="{{OG_TITLE}}">
  <meta property="og:description" content="{{OG_DESCRIPTION}}">
  <meta property="og:image" content="{{OG_IMAGE}}">
  <meta property="og:url" content="{{ARTICLE_URL}}">
  <meta property="og:site_name" content="Jaziel">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{OG_TITLE}}">
  <meta name="twitter:description" content="{{OG_DESCRIPTION}}">
  <meta name="twitter:image" content="{{OG_IMAGE}}">
  <script type="application/ld+json">{{JSON_LD}}</script>
</head>
<body>
<main class="article-layout container">
  <article class="article-main">
    <header class="article-header">
      <p class="eyebrow">{{CATEGORY}}</p>
      <h1>{{TITLE}}</h1>
      <p class="article-dek">{{DEK}}</p>
      <div class="article-meta">{{DATE_DISPLAY}} <span>•</span> {{READ_TIME}}</div>
    </header>

    <figure class="article-cover">
      <img class="article-photo" src="{{COVER_IMAGE}}" alt="{{COVER_ALT}}" width="1200" height="630">
      {{COVER_CAPTION}}
    </figure>

    <div class="article-body">
      {{INTRO}}
      {{SECTIONS}}
      {{IMAGES}}
      {{VERSE}}
      {{CLOSING}}
    </div>
  </article>
</main>
</body>
</html>
